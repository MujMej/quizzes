<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Verifikacija</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="quiz.css" />
</head>
<body>
  <nav>
    <div class="logo">QR Verifikacija</div>
    <div class="nav-right">
      <span class="badge">📱 Telefon</span>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="h1">Kod za otključavanje</div>
      <div class="sub">Pokaži ovaj kod edukatoru/na velikom ekranu.</div>

      <div class="card" style="margin-top:12px; text-align:center;">
        <div style="font-size:3.2rem; font-weight:900; letter-spacing:4px; color:var(--primary);" id="codeBox">----</div>
        <div class="note">Ako kod ne radi, skeniraj ponovo (edukator može generisati novi QR).</div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const code = (params.get("code") || "").toUpperCase().trim();
    document.getElementById("codeBox").textContent = code || "----";
  </script>
</body>
</html>
